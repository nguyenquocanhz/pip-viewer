<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>PiP Viewer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24" />
    <div>
      <h1>PiP Viewer</h1>
      <p id="status">Đang quét trang…</p>
    </div>
  </header>

  <div class="actions">
    <button id="btn-video" class="primary wide">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect class="fill" x="12" y="12" width="8" height="6" rx="1"/></svg>
      PiP video đang phát
    </button>
    <button id="btn-image">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle class="fill" cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-5 5"/></svg>
      Ảnh lớn nhất
    </button>
    <button id="btn-pick">
      <svg viewBox="0 0 24 24"><path d="M3 3l7 17 2.5-7L20 10.5z"/></svg>
      Chọn phần tử
    </button>
    <button id="btn-exit" class="wide">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Thoát PiP
    </button>
  </div>

  <section id="list-wrap" hidden>
    <h2>Video trên trang</h2>
    <ul id="list"></ul>
  </section>

  <section class="settings">
    <label><input type="checkbox" id="opt-hover" /> <span>Hiện nút PiP khi rê chuột lên video</span></label>
    <label><input type="checkbox" id="opt-blur" /> <span>Tự bật PiP khi chuyển sang tab khác</span></label>
  </section>

  <footer>
    <div class="keys">
      <span><kbd>Alt</kbd>+<kbd>P</kbd> bật/tắt PiP</span>
      <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> chọn phần tử</span>
    </div>
    <a href="#" id="open-dashboard">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Cấu hình đầy đủ
    </a>
  </footer>

  <a href="#" class="promo" id="open-pro">
    <span class="star">✦</span>
    <span><b>PiP Viewer Pro</b> — điều khiển trong cửa sổ PiP, phụ đề, ghim nhiều cửa sổ</span>
  </a>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
